# SNAIZER//NET: web (behind Caddy, HTTPS) + SSH gateway.
# Usage: cp .env.example .env && edit DOMAIN, then: docker compose up -d --build

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *hardening
    build: .
    image: snaizer-net:latest
    command: ["python", "servers/web.py"]
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      PUBLIC_URL: ${PUBLIC_URL:-}
      WEB_MAX_SESSIONS: ${WEB_MAX_SESSIONS:-50}
      SSH_PUBLIC_PORT: ${SSH_PUBLIC_PORT:-2222} # shown in the page's ssh hint
      HEALTH_PORT: "8000"
    expose:
      - "8000"
    # Uncomment to test without Caddy at http://localhost:8000
    # ports:
    #   - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512

  ssh:
    <<: *hardening
    build: .
    image: snaizer-net:latest
    command: ["python", "servers/ssh_server.py"]
    environment:
      SSH_HOST: 0.0.0.0
      SSH_PORT: "2222"
      SSH_HOST_KEY: /app/data/ssh_host_key
      SSH_MAX_SESSIONS: ${SSH_MAX_SESSIONS:-50}
      SSH_MAX_PER_IP: ${SSH_MAX_PER_IP:-5}
      SSH_IDLE_TIMEOUT: ${SSH_IDLE_TIMEOUT:-900}
      SSH_MAX_SESSION_SECONDS: ${SSH_MAX_SESSION_SECONDS:-3600}
      HEALTH_PORT: "2222"
    ports:
      # Host port defaults to 2222. Set SSH_PUBLIC_PORT=22 in .env to let
      # visitors type plain `ssh guest@domain`, but ONLY after moving the
      # host's own sshd to another port (see README, "Port 22 trade-off").
      - "${SSH_PUBLIC_PORT:-2222}:2222"
    volumes:
      - ssh_data:/app/data # persistent host key => stable fingerprint
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  ssh_data:
  caddy_data:
  caddy_config:
